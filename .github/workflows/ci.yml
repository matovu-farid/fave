name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fail_check:
        description: Deliberately fail one typecheck to validate CI reporting.
        required: true
        default: none
        type: choice
        options:
          - none
          - expo
          - worker

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo:
    name: Expo checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint Expo app
        run: npm run lint
      - name: Install Worker dependencies for integration tests
        run: npm ci --prefix fave-worker
      - name: Run application and Worker regression tests
        run: npm test
      - name: Typecheck Expo app
        env:
          CI_FAILURE_CHECK: ${{ inputs.fail_check || 'none' }}
        run: |
          if [ "$CI_FAILURE_CHECK" = expo ]; then
            failure_file="ci-validation-failure-${GITHUB_RUN_ID}.ts"
            trap 'rm -f "$failure_file"' EXIT
            printf 'const ciValidationFailure: string = 1;\n' > "$failure_file"
          fi
          npm run typecheck

  worker:
    name: Worker checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fave-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fave-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        env:
          CI_FAILURE_CHECK: ${{ inputs.fail_check || 'none' }}
        run: |
          if [ "$CI_FAILURE_CHECK" = worker ]; then
            failure_file="ci-validation-failure-${GITHUB_RUN_ID}.ts"
            trap 'rm -f "$failure_file"' EXIT
            printf 'const ciValidationFailure: string = 1;\n' > "$failure_file"
          fi
          npm run typecheck
